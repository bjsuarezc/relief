<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/relief.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relief</title>
    <script>
      /* Tema inicial ANTES de que React cargue: evita el "flash" del
         tema equivocado al abrir la app. Lee la preferencia guardada
         por el toggle; si no hay, respeta la del sistema. */
      try {
        /* El tema por defecto es CLARO: la identidad del producto es
           "tinta sobre papel". El oscuro existe (toggle) y se recuerda
           solo si el usuario lo eligió explícitamente. */
        var aj = JSON.parse(localStorage.getItem("relief-ajustes") || "null");
        var modo = aj ? aj.modo : localStorage.getItem("relief-tema") === "dark" ? "oscuro" : "claro";
        var oscuro = modo === "oscuro" || (modo === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (oscuro) document.documentElement.classList.add("dark");
        document.documentElement.dataset.fondo = oscuro ? "oscuro" : "claro";
        document.documentElement.dataset.tema = (aj && ["salvia", "terracota", "tinta", "neutro"].indexOf(aj.tema) >= 0 && aj.tema) || "salvia";

        /* Movimiento: por defecto la app ANIMA aunque el sistema pida
           "reduced motion" (Windows suele traer las animaciones apagadas).
           El interruptor en la cabecera guarda "off" para desactivarlas. */
        if (localStorage.getItem("relief-movimiento") !== "off") {
          document.documentElement.classList.add("forzar-movimiento");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
